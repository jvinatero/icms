{% extends "layouts/base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-7">

        <div class="card shadow-sm">

            <div class="card-header bg-primary text-white">

                <h4 class="mb-0">

                    <i class="bi bi-printer"></i>

                    Print Monthly Schedule

                </h4>

            </div>

            <div class="card-body">

                {% include "includes/flash_messages.html" %}

                {% if schedules %}

                <div class="mb-4">

                    <label class="form-label">

                        Select Generated Schedule

                    </label>

                    <select
                        id="schedule_id"
                        class="form-select">

                        {% for schedule in schedules %}

                        <option value="{{ schedule.id }}">

                            {{ "%02d"|format(schedule.month) }}/{{ schedule.year }}

                            &nbsp; | &nbsp;

                            Generated:

                            {{ schedule.generated_on.strftime("%b %d, %Y %I:%M %p") }}

                        </option>

                        {% endfor %}

                    </select>

                </div>

                <div class="d-flex gap-2">

                    <button
                        class="btn btn-primary"
                        onclick="previewSchedule()">

                        <i class="bi bi-eye"></i>

                        Preview

                    </button>

                    <button
                        class="btn btn-success"
                        onclick="printSchedule()">

                        <i class="bi bi-printer"></i>

                        Print

                    </button>

                </div>

                {% else %}

                <div class="alert alert-warning mb-0">

                    No generated monthly schedules found.

                </div>

                {% endif %}

            </div>

        </div>

    </div>

</div>

<script>

function previewSchedule(){

    let id=document.getElementById("schedule_id").value;

    window.location="/reports/preview/"+id;

}

function printSchedule(){

    let id=document.getElementById("schedule_id").value;

    window.open(

        "/reports/print/"+id,

        "_blank"

    );

}

</script>

{% endblock %}
